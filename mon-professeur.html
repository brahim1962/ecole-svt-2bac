<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mon professeur - École SVT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #f5f7f5;
    }

    body {
      font-family: Arial, sans-serif;
    }

    .page {
      width: 100%;
      min-height: 100vh;
    }

    .professeur-image {
      display: block;
      width: 85%;
      max-width: 1200px;
      height: auto;
      margin: 0 auto;
    }

    /* Petit bouton permettant de revenir à l'accueil */
    .retour-accueil {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 10;

      display: inline-block;
      padding: 11px 18px;

      background: #087f3e;
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 15px;

      border-radius: 24px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);
    }

    .retour-accueil:hover {
      background: #066b34;
    }

    @media (max-width: 800px) {
      .professeur-image {
        width: 100%;
      }

      .retour-accueil {
        left: 10px;
        bottom: 10px;
        padding: 9px 14px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <main class="page">
    <img
      class="professeur-image"
      src="mon-professeur-ecole-svt.png"
      alt="Mon professeur - École SVT"
    >
  </main>

  <a class="retour-accueil" href="index.html">
    ← Retour à l'accueil
  </a>

</body>
</html>
