<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mon professeur - École SVT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #f5f7f5;
      font-family: Arial, Helvetica, sans-serif;
      color: #12233f;
    }

    .page {
      position: relative;
      width: 95%;
      max-width: 1350px;
      margin: 0 auto;
      min-height: 100vh;
      background: white;
    }

    .professeur-image {
      display: block;
      width: 100%;
      height: auto;
    }

    .top-nav {
      position: absolute;
      top: 45px;
      left: 0;
      right: 0;
      z-index: 10;

      width: 100%;
      min-height: 90px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;

      padding: 10px 4%;
      background: #003b49;
      color: white;
    }

    .nav-brand {
      display: flex;
      flex-direction: column;
      min-width: 170px;
      line-height: 1.05;
    }

    .nav-brand strong {
      color: white;
      font-size: 20px;
    }

    .nav-brand span {
      margin-top: 4px;
      color: #8dcc43;
      font-size: 12px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      padding: 13px 16px;
      border-radius: 7px;
    }

    .nav-links a:hover {
      background: rgba(255,255,255,0.12);
    }

    .nav-links a.active {
      background: #2b913f;
      box-shadow: inset 0 -4px 0 #84cc43;
    }

    @media (max-width: 800px) {
      .page {
        width: 100%;
      }

      .top-nav {
        position: relative;
        top: 0;
        flex-direction: column;
        padding: 10px;
      }

      .nav-brand {
        align-items: center;
      }

      .nav-links {
        justify-content: center;
        gap: 4px;
      }

      .nav-links a {
        font-size: 12px;
        padding: 9px 8px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <nav class="top-nav">

      <div class="nav-brand">
        <strong>🧬 ÉCOLE SVT</strong>
        <span>Comprendre le vivant</span>
      </div>

      <div class="nav-links">
        <a href="index.html">🏠 Accueil</a>
        <a href="index.html#mon-espace-svt">🎓 Mon Espace SVT</a>
        <a href="mon-professeur.html" class="active">👤 Mon professeur</a>
        <a href="index.html#apres-le-bac">🪧 Après le Bac</a>
      </div>

    </nav>

    <img
      class="professeur-image"
      src="mon-professeur-ecole-svt.png"
      alt="Mon professeur - École SVT"
    >

  </main>

</body>
</html>
