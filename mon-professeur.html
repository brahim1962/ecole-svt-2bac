<script>
const SUPABASE_URL = 'https://jnbgeclyxlrjggyewbaq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_3U3GQYUOvopdBYANuH_bdg_7_Qgqzg0';

async function chargerNotifications() {
    try {
        const response = await fetch(
            `${SUPABASE_URL}/rest/v1/student_logins?seen=eq.false&select=id`,
            {
                headers: {
                    apikey: SUPABASE_KEY,
                    Authorization: `Bearer ${SUPABASE_KEY}`
                }
            }
        );

        const entrees = await response.json();
        const compteur = document.getElementById('notificationCount');

        if (Array.isArray(entrees)) {
            compteur.textContent = entrees.length;
        }
    } catch (error) {
        console.error('Erreur notifications :', error);
    }
}

chargerNotifications();
</script>
